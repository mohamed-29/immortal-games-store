name: immortal-games-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: immortal-games-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: immortal_store
      POSTGRES_USER: immortal
      POSTGRES_PASSWORD: immortal_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immortal -d immortal_store"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: immortal-games-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
    name: immortal_games_pgdata
  redis-data:
    name: immortal_games_redisdata
